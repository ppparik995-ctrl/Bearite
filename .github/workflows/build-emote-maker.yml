name: Build Emote Maker

on:
  workflow_dispatch:
  push:
    paths:
      - "sdk/mods/emote-maker/**"
      - ".github/workflows/build-emote-maker.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .so
        run: |
          cmake -S sdk/mods/emote-maker -B build-emote-maker \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-emote-maker

      - name: Package zip
        run: |
          mkdir -p out/libs/arm64-v8a
          cp sdk/mods/emote-maker/mod.json out/
          if [ -f sdk/mods/emote-maker/icon.png ]; then cp sdk/mods/emote-maker/icon.png out/; fi
          cp build-emote-maker/libemotemaker.so out/libs/arm64-v8a/
          cd out
          zip -r ../emote-maker.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emote-maker
          path: emote-maker.zip
          
