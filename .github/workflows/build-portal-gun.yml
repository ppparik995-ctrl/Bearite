name: Build Portal Gun

on:
  workflow_dispatch:
  push:
    paths:
      - "sdk/mods/portal-gun/**"
      - ".github/workflows/build-portal-gun.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .so
        run: |
          cmake -S sdk/mods/portal-gun -B build-portal-gun \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-portal-gun

      - name: Package zip
        run: |
          mkdir -p out/libs/arm64-v8a
          cp sdk/mods/portal-gun/mod.json out/
          if [ -f sdk/mods/portal-gun/icon.png ]; then cp sdk/mods/portal-gun/icon.png out/; fi
          cp build-portal-gun/libportalgun.so out/libs/arm64-v8a/
          cd out
          zip -r ../portal-gun.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-gun
          path: portal-gun.zip
          
