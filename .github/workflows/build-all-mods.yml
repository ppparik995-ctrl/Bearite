name: Build All Mods

on:
  workflow_dispatch:
  push:
    paths:
      - "sdk/mods/**"
      - ".github/workflows/build-all-mods.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Package Mods
        run: |
          mkdir -p artifacts
          for dir in sdk/mods/*/; do
            [ -f "${dir}CMakeLists.txt" ] || continue
            mod=$(basename "$dir")
            cmake -S "$dir" -B "build-$mod" \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build "build-$mod"
            mkdir -p "out-$mod/libs/arm64-v8a"
            cp "${dir}mod.json" "out-$mod/"
            if [ -f "${dir}icon.png" ]; then cp "${dir}icon.png" "out-$mod/"; fi
            cp "build-$mod"/*.so "out-$mod/libs/arm64-v8a/"
            (cd "out-$mod" && zip -r "../artifacts/${mod}.zip" .)
          done

      - name: Upload Bearite-mods
        uses: actions/upload-artifact@v4
        with:
          name: Bearite-mods
          path: artifacts/*.zip
          
